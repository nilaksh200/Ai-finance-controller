name: RazorPay AI Finance Controller CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Audit & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile and Syntax Check
        run: |
          python -m compileall -q .

      - name: Run Autonomous 3-Way Reconciliation Test Suite
        run: |
          python tests/test_audit.py

      - name: Verify Streamlit Dashboard Integrity
        run: |
          python -c "import dashboard; print('Streamlit dashboard loaded successfully!')"
